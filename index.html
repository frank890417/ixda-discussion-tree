<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>呼吸群島 · 討論樹</title>
<style>
  :root {
    --bg: #07090f;
    --fg: #e8f0ea;
    --muted: #8aa092;
    --accent: #7dffa3;
    --warn: #ffb86b;
    --danger: #ff8a7a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: "PingFang TC", "Noto Sans TC", "Helvetica Neue", sans-serif;
    overflow: hidden;
  }
  canvas { display: block; width: 100vw; height: 100vh; }
  .hud {
    position: fixed; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 18px 20px; z-index: 2;
  }
  .top, .bottom { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .top { justify-content: space-between; }
  .brand h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: 0.04em; }
  .brand p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .island {
    pointer-events: auto;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: var(--fg);
    border-radius: 999px;
    padding: 8px 14px;
    min-width: 160px;
    outline: none;
  }
  .controls { pointer-events: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button {
    border: 1px solid rgba(255,255,255,0.16);
    background: rgba(255,255,255,0.08);
    color: var(--fg);
    border-radius: 999px;
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
  }
  button.primary {
    background: linear-gradient(135deg, #1d6b45, #0f3d2a);
    border-color: rgba(125,255,163,0.35);
  }
  button.listening {
    background: linear-gradient(135deg, #8a2e1a, #4a150c);
    border-color: rgba(255,140,100,0.5);
    box-shadow: 0 0 24px rgba(255,80,60,0.25);
  }
  button:hover { filter: brightness(1.08); }
  .status { color: var(--muted); font-size: 13px; }
  .status.on { color: var(--accent); }
  .meter {
    width: 88px; height: 10px; border-radius: 999px;
    background: rgba(255,255,255,0.08);
    overflow: hidden; border: 1px solid rgba(255,255,255,0.12);
  }
  .meter > i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, #2f8f5b, #7dffa3);
    transition: width 80ms linear;
  }
  .heard {
    position: fixed; left: 50%; top: 22%; transform: translateX(-50%);
    max-width: min(720px, 90vw); text-align: center;
    font-size: clamp(18px, 3vw, 28px); line-height: 1.35;
    color: rgba(232,240,234,0.92); text-shadow: 0 2px 24px rgba(0,0,0,0.6);
    pointer-events: none; z-index: 2; min-height: 1.4em;
  }
  .heard .dim { color: var(--muted); font-size: 0.7em; }
  .transcript {
    pointer-events: none;
    max-width: min(520px, 42vw);
    max-height: 28vh;
    overflow: hidden;
    mask-image: linear-gradient(to bottom, transparent, black 18%, black 82%, transparent);
    font-size: 13px; line-height: 1.45; color: var(--muted);
  }
  .transcript.hidden { display: none; }
  .transcript .final { color: #cfe8d6; }
  .transcript .interim { color: #6f8678; font-style: italic; }
  .hint {
    position: fixed; left: 50%; bottom: 72px; transform: translateX(-50%);
    color: var(--muted); font-size: 12px; opacity: 0.75; pointer-events: none;
    text-align: center;
  }
  .banner {
    position: fixed; top: 64px; left: 50%; transform: translateX(-50%);
    background: rgba(40,20,10,0.92); border: 1px solid rgba(255,184,107,0.4);
    color: var(--warn); padding: 10px 14px; border-radius: 12px;
    font-size: 13px; max-width: 90vw; z-index: 3; display: none;
  }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="banner" id="banner"></div>
  <div class="heard" id="heard"><span class="dim">按「開始聽」後說話</span></div>
  <div class="hud">
    <div class="top">
      <div class="brand">
        <h1>呼吸群島 · 討論樹</h1>
        <p>Chrome 本機語音 · 愈說愈長</p>
      </div>
      <input class="island" id="island" value="未命名的島" maxlength="40" aria-label="島名" />
    </div>
    <div class="bottom">
      <div class="controls">
        <button class="primary" id="toggle">開始聽</button>
        <button id="demo">加示範枝</button>
        <button id="clear">清空</button>
        <button id="full">全螢幕</button>
        <button id="toggleLog">隱藏逐字</button>
        <div class="meter" title="麥克風音量"><i id="meter"></i></div>
        <span class="status" id="status">待機</span>
      </div>
      <div class="transcript" id="log"></div>
    </div>
  </div>
  <div class="hint">請用 Chrome 開 GitHub Pages 網址 · 空白鍵聽／停 · F 全螢幕 · C 清空<br>Chrome 語音辨識需要網路；音量條有動＝麥克風有收到</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const toggleBtn = document.getElementById('toggle');
  const clearBtn = document.getElementById('clear');
  const fullBtn = document.getElementById('full');
  const demoBtn = document.getElementById('demo');
  const toggleLogBtn = document.getElementById('toggleLog');
  const statusEl = document.getElementById('status');
  const logEl = document.getElementById('log');
  const islandEl = document.getElementById('island');
  const banner = document.getElementById('banner');
  const heardEl = document.getElementById('heard');
  const meterEl = document.getElementById('meter');

  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const root = {
    text: '呼吸', x: 0, y: 0, angle: -Math.PI / 2, depth: 0,
    children: [], born: performance.now(), energy: 1
  };
  let nodes = [root];
  let listening = false;
  let recognition = null;
  let restartTimer = null;
  let pulse = 0;
  let audioCtx = null, analyser = null, micStream = null, rafMeter = null;
  let lastIngested = '';
  let lastIngestAt = 0;

  function showBanner(msg) {
    banner.textContent = msg;
    banner.style.display = 'block';
  }
  function hideBanner() { banner.style.display = 'none'; }

  function setStatus(text, on) {
    statusEl.textContent = text;
    statusEl.classList.toggle('on', !!on);
  }

  function setHeard(text, dim) {
    if (dim) heardEl.innerHTML = '<span class="dim">' + text + '</span>';
    else heardEl.textContent = text;
  }

  function addLog(text, kind) {
    const div = document.createElement('div');
    div.className = kind;
    div.textContent = text;
    logEl.prepend(div);
    while (logEl.children.length > 40) logEl.lastChild.remove();
  }

  function tokenize(text) {
    const cleaned = text.replace(/[，。！？、,.!?\s]+/g, ' ').trim();
    if (!cleaned) return [];
    const parts = cleaned.split(' ').filter(Boolean);
    const out = [];
    for (const p of parts) {
      if ([...p].length <= 10) out.push(p);
      else {
        const chars = [...p];
        for (let i = 0; i < chars.length; i += 5) out.push(chars.slice(i, i + 5).join(''));
      }
    }
    return out.slice(0, 5);
  }

  function pickParent() {
    const candidates = nodes.filter(n => n.depth < 7);
    candidates.sort((a, b) => (b.born - a.born) + (a.children.length - b.children.length) * 80);
    return candidates[Math.floor(Math.random() * Math.min(5, candidates.length))] || root;
  }

  function addNode(text) {
    const parent = pickParent();
    const sibling = parent.children.length;
    const spread = 0.55 + Math.random() * 0.35;
    const offset = (sibling - parent.children.length / 2) * spread + (Math.random() - 0.5) * 0.2;
    const node = {
      text, parent, angle: parent.angle + offset, depth: parent.depth + 1,
      children: [], born: performance.now(), energy: 1,
      len: 42 + Math.random() * 28 - parent.depth * 3,
      x: parent.x, y: parent.y
    };
    parent.children.push(node);
    nodes.push(node);
    pulse = 1;
  }

  function ingestUtterance(text, force) {
    const t = (text || '').trim();
    if (!t) return;
    const now = performance.now();
    if (!force && t === lastIngested && now - lastIngestAt < 1500) return;
    lastIngested = t;
    lastIngestAt = now;
    const bits = tokenize(t);
    if (!bits.length) addNode(t.slice(0, 12));
    else for (const b of bits) addNode(b);
  }

  function layout() {
    root.x = W * 0.5; root.y = H * 0.78;
    (function walk(n) {
      for (const c of n.children) {
        const targetX = n.x + Math.cos(c.angle) * c.len;
        const targetY = n.y + Math.sin(c.angle) * c.len;
        c.x += (targetX - c.x) * 0.18;
        c.y += (targetY - c.y) * 0.18;
        walk(c);
      }
    })(root);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    const g = ctx.createRadialGradient(W/2, H*0.7, 20, W/2, H*0.55, Math.max(W,H)*0.7);
    g.addColorStop(0, 'rgba(30,70,50,0.22)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    layout();
    pulse *= 0.92;

    (function drawEdge(n) {
      for (const c of n.children) {
        const age = Math.min(1, (performance.now() - c.born) / 700);
        ctx.beginPath();
        ctx.moveTo(n.x, n.y);
        const mx = (n.x + c.x) / 2 + Math.sin(c.angle) * 12 * age;
        const my = (n.y + c.y) / 2 - Math.cos(c.angle) * 12 * age;
        ctx.quadraticCurveTo(mx, my, c.x, c.y);
        ctx.strokeStyle = `rgba(125,255,163,${0.18 + 0.35 * age})`;
        ctx.lineWidth = Math.max(1, 4.5 - c.depth * 0.45);
        ctx.stroke();
        drawEdge(c);
      }
    })(root);

    for (const n of nodes) {
      const age = Math.min(1, (performance.now() - n.born) / 600);
      const r = (n.depth === 0 ? 7 : 3.2) + pulse * 2;
      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
      ctx.fillStyle = n.depth === 0 ? 'rgba(125,255,163,0.85)' : `rgba(200,255,220,${0.35 + 0.5 * age})`;
      ctx.fill();
      ctx.font = n.depth === 0 ? '600 16px "PingFang TC", sans-serif' : `${Math.max(12, 15 - n.depth)}px "PingFang TC", sans-serif`;
      ctx.fillStyle = `rgba(232,240,234,${0.55 + 0.4 * age})`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText(n.depth === 0 ? (islandEl.value || n.text) : n.text, n.x, n.y - 10);
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  function supportsSpeech() {
    return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  }

  function tickMeter() {
    if (!analyser) return;
    const data = new Uint8Array(analyser.fftSize);
    analyser.getByteTimeDomainData(data);
    let sum = 0;
    for (let i = 0; i < data.length; i++) {
      const v = (data[i] - 128) / 128;
      sum += v * v;
    }
    const rms = Math.sqrt(sum / data.length);
    const pct = Math.min(100, Math.floor(rms * 280));
    meterEl.style.width = pct + '%';
    rafMeter = requestAnimationFrame(tickMeter);
  }

  async function ensureMic() {
    if (micStream) return true;
    if (!navigator.mediaDevices?.getUserMedia) {
      showBanner('這個瀏覽器無法取用麥克風。');
      return false;
    }
    try {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true }
      });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const src = audioCtx.createMediaStreamSource(micStream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      src.connect(analyser);
      tickMeter();
      return true;
    } catch (err) {
      showBanner('麥克風權限失敗：' + (err.message || err.name) + '。到網址列鎖頭允許麥克風。');
      return false;
    }
  }

  function scheduleRestart() {
    clearTimeout(restartTimer);
    restartTimer = setTimeout(() => {
      if (!listening || !recognition) return;
      try { recognition.start(); }
      catch (err) {
        // InvalidStateError if already started — ignore
        if (!String(err).includes('InvalidStateError')) {
          setStatus('重啟辨識失敗', false);
        }
      }
    }, 280);
  }

  async function startListening() {
    hideBanner();
    if (!window.isSecureContext) {
      showBanner('需要安全連線（https 或 localhost）。請開 GitHub Pages 網址，不要用檔案雙擊。');
      return;
    }
    if (!supportsSpeech()) {
      showBanner('沒有語音辨識 API。請用桌面版 Google Chrome。');
      return;
    }
    const ok = await ensureMic();
    if (!ok) return;
    if (audioCtx?.state === 'suspended') await audioCtx.resume();

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR();
    recognition.lang = 'zh-TW';
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      listening = true;
      toggleBtn.textContent = '停止聽';
      toggleBtn.classList.add('listening');
      setStatus('聆聽中（請說話）', true);
      setHeard('…正在聽', true);
    };

    recognition.onerror = (e) => {
      const err = e.error;
      if (err === 'not-allowed') {
        listening = false;
        showBanner('麥克風被拒絕。請允許後再按開始聽。');
        setStatus('麥克風被拒', false);
      } else if (err === 'network') {
        showBanner('語音辨識需要網路（Chrome 會連到辨識服務）。請確認網路後重試。');
        setStatus('網路錯誤', false);
      } else if (err === 'no-speech') {
        setStatus('沒聽到聲音，繼續聽…', true);
      } else if (err === 'aborted') {
        // ignore
      } else {
        setStatus('錯誤：' + err, false);
      }
    };

    recognition.onend = () => {
      if (listening) {
        setStatus('辨識暫停，自動重接…', true);
        scheduleRestart();
      } else {
        toggleBtn.textContent = '開始聽';
        toggleBtn.classList.remove('listening');
        setStatus('待機', false);
        setHeard('按「開始聽」後說話', true);
      }
    };

    recognition.onresult = (event) => {
      let interim = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const res = event.results[i];
        const text = (res[0].transcript || '').trim();
        if (!text) continue;
        if (res.isFinal) {
          addLog(text, 'final');
          setHeard(text, false);
          ingestUtterance(text, true);
          setStatus('已長出枝：' + text.slice(0, 18), true);
        } else {
          interim += text;
        }
      }
      if (interim) {
        setHeard(interim, false);
        const first = logEl.firstChild;
        if (first && first.classList.contains('interim')) first.textContent = interim;
        else addLog(interim, 'interim');
        // Soft grow from longer interim so it feels alive sooner
        if ([...interim].length >= 4) ingestUtterance(interim, false);
      }
    };

    listening = true;
    try {
      recognition.start();
    } catch (err) {
      listening = false;
      showBanner('無法啟動語音辨識：' + err.message);
    }
  }

  function stopListening() {
    listening = false;
    clearTimeout(restartTimer);
    if (recognition) {
      try { recognition.onend = null; recognition.stop(); } catch (_) {}
      recognition = null;
    }
    toggleBtn.textContent = '開始聽';
    toggleBtn.classList.remove('listening');
    setStatus('待機', false);
    setHeard('按「開始聽」後說話', true);
  }

  toggleBtn.addEventListener('click', () => {
    if (listening) stopListening();
    else startListening();
  });

  demoBtn.addEventListener('click', () => {
    const samples = ['會呼吸', '便利商店', '末班車', '毛孩', '加班島', '溫度', '節奏', '陪伴'];
    const t = samples[Math.floor(Math.random() * samples.length)];
    addLog('[示範] ' + t, 'final');
    ingestUtterance(t, true);
    setHeard(t, false);
  });

  clearBtn.addEventListener('click', () => {
    if (!confirm('清空這棵樹？')) return;
    root.children = [];
    root.born = performance.now();
    nodes = [root];
    logEl.innerHTML = '';
    setHeard('按「開始聽」後說話', true);
  });

  fullBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  });

  toggleLogBtn.addEventListener('click', () => {
    const hidden = logEl.classList.toggle('hidden');
    toggleLogBtn.textContent = hidden ? '顯示逐字' : '隱藏逐字';
  });

  window.addEventListener('keydown', (e) => {
    if (e.target === islandEl) return;
    if (e.code === 'Space') { e.preventDefault(); toggleBtn.click(); }
    else if (e.key === 'f' || e.key === 'F') fullBtn.click();
    else if (e.key === 'c' || e.key === 'C') clearBtn.click();
  });

  if (!supportsSpeech()) showBanner('請用桌面版 Chrome 打開。');
  else if (!window.isSecureContext) showBanner('請用 https://frank890417.github.io/ixda-discussion-tree/ 打開，不要雙擊本地檔。');
})();
</script>
</body>
</html>
