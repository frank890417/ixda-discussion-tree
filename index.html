<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>呼吸群島 · 討論板</title>
<link rel="stylesheet" href="./css/app.css" />
</head>
<body class="mode-board">
  <canvas id="c" class="hidden"></canvas>
  <div id="boardRoot"></div>
  <div class="banner" id="banner"></div>
  <div class="heard" id="heard"><span class="dim">按「開始聽」後說話，或手動輸入</span></div>
  <div class="hud">
    <div class="top">
      <div class="brand">
        <h1>呼吸群島 · 討論板</h1>
        <p>語音定稿 → 規則凝結 → 主題簇（v2 / PR1a）</p>
      </div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
        <div class="mode-switch" role="group" aria-label="顯示模式">
          <button type="button" id="modeBoard" class="active">Board</button>
          <button type="button" id="modeTree">Tree</button>
        </div>
        <input class="island" id="island" value="未命名的島" maxlength="40" aria-label="島名" />
      </div>
    </div>
    <div class="bottom">
      <div class="controls">
        <button class="primary" id="toggle">開始聽</button>
        <button id="demo">Demo</button>
        <button id="clear">清空</button>
        <button id="full">全螢幕</button>
        <button class="ghost" id="exportBtn">匯出 JSON</button>
        <button class="ghost" id="importBtn">匯入 JSON</button>
        <button class="ghost" id="toggleLog">隱藏逐字</button>
        <div class="meter" title="麥克風音量"><i id="meter"></i></div>
        <span class="status" id="status">待機</span>
      </div>
      <div class="manual-row">
        <input id="manualInput" type="text" maxlength="200" placeholder="麥克風掛了？打字後按送出" aria-label="手動輸入" />
        <button id="manualSend" class="primary">送出</button>
      </div>
      <div class="transcript" id="log"></div>
    </div>
  </div>
  <input type="file" id="fileImport" accept="application/json,.json" />
  <div class="hint">Chrome · https／localhost · 空白鍵聽／停 · F 全螢幕 · C 清空 · B Board · T Tree<br>只有語音「定稿」會凝結進板；interim 只更新正在聽</div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
